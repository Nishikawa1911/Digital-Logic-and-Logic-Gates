<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Логикалық схема жинағыш</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--fg:#14171c;--mut:#667085;--bd:#d3d8e0;--red:#e5322d;--w0:#9aa1ab;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1014;--card:#1a1d23;--fg:#eceff4;--mut:#9aa3b2;--bd:#343a46;--w0:#6b7280}}
:root[data-theme="dark"]{--bg:#0e1014;--card:#1a1d23;--fg:#eceff4;--mut:#9aa3b2;--bd:#343a46;--w0:#6b7280}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.4}
.wrap{max-width:640px;margin:0 auto;padding:14px 12px 28px}
h1{font-size:21px;margin:4px 0 2px}
.sub{color:var(--mut);font-size:13.5px;margin:0 0 12px}
.pal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 4px;font-weight:700;font-size:14px;cursor:pointer}
button small{display:block;font-weight:400;font-size:11px;color:var(--mut)}
button:active{transform:scale(.97)}
button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
button.on{background:var(--red);border-color:var(--red);color:#fff}
.bar{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.bar button{flex:1;min-width:92px;font-weight:600;font-size:13px}
#cv{display:block;width:100%;aspect-ratio:400/520;background:var(--card);border:1px solid var(--bd);border-radius:12px;touch-action:none;user-select:none;-webkit-user-select:none}
#msg{min-height:20px;font-size:13px;color:var(--mut);margin:8px 2px 0}
table{border-collapse:collapse;margin-top:10px;width:100%;text-align:center;font-size:15px}
th,td{border:1px solid var(--bd);padding:5px}
th{background:var(--card)}
tr.hi td{color:var(--red);font-weight:700}
#tt p{color:var(--mut);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<h1>Логикалық схема жинағыш</h1>
<p class="sub">Элемент қосыңыз, сымдарды қосыңыз. Шарт орындалса шам қызыл болып жанады.</p>
<div class="pal" id="pal"></div>
<svg id="cv" viewBox="0 0 400 520"></svg>
<div id="msg"></div>
<div class="bar">
<button id="bDl">🗑 Өшіру</button>
<button id="bEx">Мысал</button>
<button id="bDel">Сым өшіру</button>
<button id="bTb">Ақиқат кестесі</button>
<button id="bClr">Тазалау</button>
</div>
<div id="tt"></div>
</div>
<script>
var NS="http://www.w3.org/2000/svg",cv=document.getElementById("cv");
var nodes=[],wires=[],uid=1,src=null,sel=null,trash=null,lp=0,delMode=false,tv=false,drag=null;
var PAL=[["IN","0 / 1","Кіріс"],["AND","AND","ЖӘНЕ"],["OR","OR","НЕМЕСЕ"],["NOT","NOT","ЕМЕС"],["NAND","NAND","Шеффер"],["NOR","NOR","Пирс"],["XOR","XOR","⊕"],["XNOR","XNOR","⊕ + ЕМЕС"],["LAMP","💡 Шам","Шығыс x"]];
var G={AND:{s:"AND"},NAND:{s:"AND",n:1},OR:{s:"OR"},NOR:{s:"OR",n:1},XOR:{s:"OR",x:1},XNOR:{s:"OR",x:1,n:1},NOT:{s:"NOT",n:1}};
var SH={AND:"M14 4H36A21 21 0 0 1 36 46H14Z",OR:"M10 4Q38 4 58 25Q38 46 10 46Q22 25 10 4Z",NOT:"M14 6L54 25L14 44Z"};
var XE={AND:57,OR:58,NOT:54};
function el(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function wOf(n){return n.t==="IN"||n.t==="LAMP"?50:70}
function nIn(n){return n.t==="IN"?0:(n.t==="NOT"||n.t==="LAMP")?1:2}
function inY(n,i){return nIn(n)===1?25:(i?35:15)}
function find(id){return nodes.filter(function(n){return n.id===id})[0]}
function ev(id,seen,ov){
  seen=seen||[];var n=find(id);if(!n||seen.indexOf(id)>-1)return 0;
  if(n.t==="IN")return ov&&ov[id]!==undefined?ov[id]:n.v;
  var s=seen.concat(id),a=[];
  for(var i=0;i<nIn(n);i++){var w=wires.filter(function(w){return w.to===id&&w.p===i})[0];a.push(w?ev(w.from,s,ov):0)}
  switch(n.t){
    case "NOT":return +!a[0];case "AND":return a[0]&a[1];case "OR":return a[0]|a[1];
    case "NAND":return +!(a[0]&a[1]);case "NOR":return +!(a[0]|a[1]);
    case "XOR":return a[0]^a[1];case "XNOR":return +!(a[0]^a[1]);case "LAMP":return a[0];
  }
}
function setMsg(t){document.getElementById("msg").textContent=t||""}
function pt(e){var p=cv.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(cv.getScreenCTM().inverse())}
function render(){
  cv.innerHTML="";
  var d=el("defs",{},cv),pa=el("pattern",{id:"dots",width:20,height:20,patternUnits:"userSpaceOnUse"},d);
  el("circle",{cx:2,cy:2,r:1,fill:"var(--bd)"},pa);
  var bg=el("rect",{width:400,height:520,fill:"url(#dots)"},cv);bg.setAttribute("data-bg","1");
  var gW=el("g",{},cv),gN=el("g",{},cv);
  wires.forEach(function(w){
    var a=find(w.from),b=find(w.to),x1=a.x+wOf(a),y1=a.y+25,x2=b.x,y2=b.y+inY(b,w.p),dd=Math.max(30,Math.abs(x2-x1)/2);
    var p="M"+x1+" "+y1+"C"+(x1+dd)+" "+y1+" "+(x2-dd)+" "+y2+" "+x2+" "+y2;
    el("path",{d:p,fill:"none",stroke:ev(w.from)?"var(--red)":"var(--w0)","stroke-width":3,"stroke-linecap":"round"},gW);
    var h=el("path",{d:p,fill:"none",stroke:"transparent","stroke-width":16},gW);
    h.addEventListener("pointerdown",function(e){if(delMode){e.preventDefault();wires=wires.filter(function(x){return x!==w});render()}});
  });
  nodes.forEach(function(n){drawNode(n,gN)});
  if(tv)table();
}
function drawNode(n,par){
  var g=el("g",{transform:"translate("+n.x+" "+n.y+")"},par),w=wOf(n);
  var st={stroke:"var(--fg)","stroke-width":2.5,"stroke-linejoin":"round","stroke-linecap":"round"};
  function S(o){var r={};for(var k in st)r[k]=st[k];for(var k2 in o)r[k2]=o[k2];return r}
  el("rect",{x:0,y:0,width:w,height:50,fill:"transparent"},g);
  if(sel===n.id)el("rect",{x:-5,y:-7,width:w+10,height:64,rx:7,fill:"none",stroke:"var(--red)","stroke-width":1.5,"stroke-dasharray":"4 3"},g);
  if(trash===n.id){var tg=el("g",{style:"cursor:pointer"},g);el("circle",{cx:w/2,cy:84,r:15,fill:"var(--red)"},tg);var ti=el("text",{x:w/2,y:90,"text-anchor":"middle","font-size":17},tg);ti.textContent="🗑";tg.addEventListener("pointerdown",function(e){e.stopPropagation();e.preventDefault();nodes=nodes.filter(function(m){return m!==n});wires=wires.filter(function(x){return x.from!==n.id&&x.to!==n.id});if(src===n.id)src=null;sel=null;trash=null;setMsg("Элемент өшірілді");render()})}
  if(n.t==="IN"){
    var l=el("text",{x:22,y:-4,"text-anchor":"middle","font-size":14,"font-weight":700,fill:"var(--mut)"},g);l.textContent=n.name;
    el("line",S({x1:40,y1:25,x2:50,y2:25}),g);
    el("rect",S({x:4,y:7,width:36,height:36,rx:5,fill:n.v?"var(--red)":"var(--card)"}),g);
    var t=el("text",{x:22,y:34,"text-anchor":"middle","font-size":22,"font-weight":700,fill:n.v?"#fff":"var(--fg)"},g);t.textContent=n.v;
  }else if(n.t==="LAMP"){
    var v=ev(n.id);
    el("line",S({x1:0,y1:25,x2:12,y2:25}),g);
    var c=el("circle",S({cx:30,cy:25,r:18,fill:v?"#ff3b30":"var(--card)"}),g);
    if(v)c.style.filter="drop-shadow(0 0 7px #ff3b30) drop-shadow(0 0 16px #ff3b30)";
    var q=v?"#fff":"var(--fg)";
    el("line",S({x1:17.3,y1:12.3,x2:42.7,y2:37.7,stroke:q}),g);el("line",S({x1:17.3,y1:37.7,x2:42.7,y2:12.3,stroke:q}),g);
    var tx=el("text",{x:30,y:62,"text-anchor":"middle","font-size":13,"font-weight":700,fill:v?"var(--red)":"var(--mut)"},g);tx.textContent="x = "+v;
  }else{
    var C=G[n.t],xe=XE[C.s];
    for(var i=0;i<nIn(n);i++)el("line",S({x1:0,y1:inY(n,i),x2:14,y2:inY(n,i)}),g);
    el("path",S({d:SH[C.s],fill:"var(--card)"}),g);
    if(C.x)el("path",S({d:"M3 4Q15 25 3 46",fill:"none"}),g);
    var ox=xe;
    if(C.n){el("circle",S({cx:xe+4,cy:25,r:4,fill:"var(--card)","stroke-width":2}),g);ox=xe+8}
    el("line",S({x1:ox,y1:25,x2:70,y2:25}),g);
    var nm=el("text",{x:35,y:62,"text-anchor":"middle","font-size":11,fill:"var(--mut)"},g);nm.textContent=n.t;
  }
  for(var j=0;j<nIn(n);j++)(function(j){
    var y=inY(n,j),used=wires.some(function(w){return w.to===n.id&&w.p===j});
    el("circle",{cx:0,cy:y,r:4.5,fill:used?"var(--fg)":"var(--bd)",stroke:"var(--fg)","stroke-width":1.5},g);
    var h=el("circle",{cx:0,cy:y,r:11,fill:"transparent"},g);
    h.addEventListener("pointerdown",function(e){
      e.stopPropagation();e.preventDefault();
      if(src!==null&&src!==n.id){
        wires=wires.filter(function(w){return !(w.to===n.id&&w.p===j)});
        wires.push({from:src,to:n.id,p:j});src=null;setMsg("Сым қосылды");render();
      }else setMsg("Алдымен элементтің шығыс нүктесін (оң жақ) басыңыз");
    });
  })(j);
  if(n.t!=="LAMP"){
    el("circle",{cx:w,cy:25,r:src===n.id?7:4.5,fill:src===n.id?"var(--red)":"var(--fg)"},g);
    var ho=el("circle",{cx:w,cy:25,r:13,fill:"transparent"},g);
    ho.addEventListener("pointerdown",function(e){
      e.stopPropagation();e.preventDefault();if(delMode)return;
      src=src===n.id?null:n.id;setMsg(src===null?"":"Енді екінші элементтің кіріс нүктесін (сол жақ) басыңыз");render();
    });
  }
  g.addEventListener("pointerdown",function(e){
    e.preventDefault();
    if(delMode){nodes=nodes.filter(function(m){return m!==n});wires=wires.filter(function(x){return x.from!==n.id&&x.to!==n.id});if(src===n.id)src=null;render();return}
    var p=pt(e);drag={n:n,px:p.x,py:p.y,ox:n.x,oy:n.y,mv:false,lp:false};
    clearTimeout(lp);var dr=drag;
    lp=setTimeout(function(){if(drag===dr&&!dr.mv){dr.lp=true;trash=n.id;sel=n.id;setMsg("🗑 басып элементті өшіріңіз");render()}},450);
  });
}
window.addEventListener("pointermove",function(e){
  if(!drag)return;var p=pt(e),dx=p.x-drag.px,dy=p.y-drag.py;
  if(Math.hypot(dx,dy)>4)drag.mv=true;
  if(drag.mv){drag.n.x=Math.max(0,Math.min(400-wOf(drag.n),drag.ox+dx));drag.n.y=Math.max(14,Math.min(420,drag.oy+dy));render()}
});
window.addEventListener("pointerup",function(){
  if(drag){clearTimeout(lp);sel=drag.n.id;if(!drag.mv&&!drag.lp&&drag.n.t==="IN")drag.n.v=drag.n.v?0:1;if(!drag.lp)trash=null;setMsg("Таңдалды. Өшіру үшін 🗑 Өшіру түймесін басыңыз");render()}
  drag=null;
});
cv.addEventListener("contextmenu",function(e){e.preventDefault()});
cv.addEventListener("pointerdown",function(e){
  if(e.target.getAttribute&&e.target.getAttribute("data-bg")){src=null;sel=null;trash=null;setMsg();render()}
});
function add(t){
  var n={id:uid++,t:t,v:0,x:0,y:0};
  if(t==="IN"){
    var u=nodes.filter(function(m){return m.t==="IN"}).map(function(m){return m.name}),c=0;
    while(u.indexOf(String.fromCharCode(65+c))>-1)c++;
    n.name=String.fromCharCode(65+c);n.x=10;n.y=30+(c%6)*75;
  }else if(t==="LAMP"){
    var k=nodes.filter(function(m){return m.t==="LAMP"}).length;n.x=345;n.y=30+(k%6)*75;
  }else{
    var g=nodes.filter(function(m){return m.t!=="IN"&&m.t!=="LAMP"}).length;
    n.x=100+(g%3)*85;n.y=30+(Math.floor(g/3)%6)*70+(g%3)*12;
  }
  nodes.push(n);render();
}
function example(){
  nodes=[];wires=[];uid=1;src=null;sel=null;
  function mk(t,x,y,nm){var n={id:uid++,t:t,x:x,y:y,v:0};if(nm)n.name=nm;nodes.push(n);return n.id}
  function cn(f,t,p){wires.push({from:f,to:t,p:p})}
  var A=mk("IN",10,30,"A"),B=mk("IN",10,150,"B"),n1=mk("NOT",90,20),n2=mk("NOT",90,130),an=mk("AND",180,70),
      o1=mk("OR",90,270),n3=mk("NOT",180,270),o2=mk("OR",265,160),L=mk("LAMP",345,160);
  cn(A,n1,0);cn(B,n2,0);cn(n1,an,0);cn(n2,an,1);cn(A,o1,0);cn(B,o1,1);cn(o1,n3,0);cn(an,o2,0);cn(n3,o2,1);cn(o2,L,0);
  setMsg("Мысал: x = (ā·b̄) + (a+b)̄. Кіріс төртбұрышын басып 0/1 ауыстырыңыз.");render();
}
function table(){
  var box=document.getElementById("tt");
  var ins=nodes.filter(function(n){return n.t==="IN"}).sort(function(a,b){return a.name<b.name?-1:1});
  var lamp=nodes.filter(function(n){return n.t==="LAMP"})[0],k=ins.length;
  if(!lamp||!k){box.innerHTML="<p>Кестеге кемінде бір кіріс пен бір шам керек.</p>";return}
  if(k>5){box.innerHTML="<p>Кірістер саны 5-тен аспауы керек.</p>";return}
  var h="<table><tr>"+ins.map(function(n){return "<th>"+n.name+"</th>"}).join("")+"<th>x</th></tr>";
  for(var i=0;i<(1<<k);i++){
    var ov={},cells="";
    ins.forEach(function(n,j){var b=(i>>(k-1-j))&1;ov[n.id]=b;cells+="<td>"+b+"</td>"});
    var x=ev(lamp.id,[],ov);
    h+="<tr"+(x?' class="hi"':"")+">"+cells+"<td>"+x+"</td></tr>";
  }
  box.innerHTML=h+"</table>";
}
var pal=document.getElementById("pal");
PAL.forEach(function(p){
  var b=document.createElement("button");b.innerHTML=p[1]+"<small>"+p[2]+"</small>";
  b.addEventListener("click",function(){add(p[0])});pal.appendChild(b);
});
document.getElementById("bEx").onclick=example;
document.getElementById("bDel").onclick=function(){
  delMode=!delMode;this.classList.toggle("on",delMode);src=null;
  setMsg(delMode?"Өшіру режимі: элементті немесе сымды басыңыз":"");render();
};
document.getElementById("bTb").onclick=function(){tv=!tv;if(tv)table();else document.getElementById("tt").innerHTML=""};
document.getElementById("bClr").onclick=function(){nodes=[];wires=[];src=null;sel=null;uid=1;setMsg("Таза алаң. Жоғарыдан элемент қосыңыз.");render()};
function delSel(){
  if(sel===null){setMsg("Алдымен өшіретін элементті басыңыз");return}
  var id=sel;nodes=nodes.filter(function(m){return m.id!==id});wires=wires.filter(function(x){return x.from!==id&&x.to!==id});
  if(src===id)src=null;sel=null;setMsg("Элемент өшірілді");render();
}
document.getElementById("bDl").onclick=delSel;
window.addEventListener("keydown",function(e){if(e.key==="Delete"||e.key==="Backspace")delSel()});
setMsg("Таза алаң. Жоғарыдан элемент қосыңыз. «Мысал» түймесі дайын схема көрсетеді.");render();
</script>
</body>
</html>
